services:
  spatial-db:
    image: postgis/postgis:15-3.4
    container_name: ev_spatial_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ev_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ev-analytics-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ev_analytics}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ev_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@evanalytics.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      spatial-db:
        condition: service_healthy
    networks:
      - ev-analytics-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ev_backend_api
    restart: always
    environment:
      POSTGRES_HOST: spatial-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ev_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_URI: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@spatial-db:5432/${POSTGRES_DB:-ev_analytics}
      NREL_API_KEY: ${NREL_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      spatial-db:
        condition: service_healthy
    networks:
      - ev-analytics-net

volumes:
  pgdata:
    driver: local
  pgadmin_data:
    driver: local

networks:
  ev-analytics-net:
    driver: bridge