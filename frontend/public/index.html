<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1e293b" />
    <meta
      name="description"
      content="EV Charging Infrastructure Accessibility Analytics Platform - PostGIS, FastAPI, and React GIS Visualization"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>EV Charging Accessibility Analytics</title>

    <!-- Leaflet GIS Map Engine Stylesheet -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />

    <style>
      /* Base CSS Reset & GIS Canvas Height Enforcer */
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        overflow: hidden;
      }

      #root {
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
      }

      /* Custom Leaflet Map Container & Popup Styling Overrides */
      .leaflet-container {
        width: 100%;
        height: 100%;
        background-color: #1e293b !important;
      }

      .leaflet-popup-content-wrapper {
        background-color: #1e293b !important;
        color: #f8fafc !important;
        border: 1px solid #334155;
        border-radius: 8px !important;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5) !important;
      }

      .leaflet-popup-tip {
        background-color: #1e293b !important;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
